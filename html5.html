
<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>EPD05 - Lazy Loading HTML5</title>

        <style>
            body {
                font-family: Arial, sans-serif;
                text-align: center;
                background-color: #f2f2f2;
            }

            h1 {
                color: #333;
            }

            img {
                display: block;
                width: 800px;
                max-width: 90%;
                height: 500px;
                margin: 30px auto;
                border: 2px solid #333;
            }
        </style>
    </head>

    <body>
        <h1>Carga de imágenes con HTML5</h1>

        <p>Las imágenes se cargan de forma perezosa
            utilizando el atributo loading="lazy".</p>

        <img src="imagenes/foto1.jpg" loading="lazy"
             alt="Imagen 1">

        <img src="imagenes/foto2.jpg" loading="lazy"
             alt="Imagen 2">

        <img src="imagenes/foto3.jpg" loading="lazy"
             alt="Imagen 3">

        <img src="imagenes/foto4.jpg" loading="lazy"
             alt="Imagen 4">

        <img src="imagenes/foto5.jpg" loading="lazy"
             alt="Imagen 5">

    </body>
</html>
